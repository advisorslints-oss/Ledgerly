<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ledgerly</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var query = window.location.search || '';
        var hash = window.location.hash || '';
        var rest = path.replace(/^\/(Ledgerly|ledgerly)\/?/i, '');
        if (rest && !hash) {
          hash = '#/' + rest;
        }
        window.location.replace('/Ledgerly/' + hash + (query ? (hash ? '&' : '?') + query.slice(1) : ''));
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/Ledgerly/">Ledgerly</a>...</p>
  </body>
</html>
